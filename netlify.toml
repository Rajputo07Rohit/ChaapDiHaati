[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

# Proxies API calls through Netlify to the Railway backend so the browser
# sees everything as same-origin — no CORS setup needed, and the existing
# session cookie (SameSite=Lax) keeps working without any backend changes.
# Replace the target with your real Railway backend URL after first deploy.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-RAILWAY-URL.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (e.g. /pos, /orders) don't 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
